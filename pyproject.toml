[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egress-sync"
version = "0.2.3"
description = "Publish mihomo direct-egress rule-sets derived from cluster and runtime state"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime dependencies: none. The point of the standard library here is that the
# image is `python:3-alpine` plus this package, and the derivation is testable
# without mocking a framework.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
egress-sync = "egress_sync.__main__:main"

[tool.setuptools]
packages = ["egress_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["egress_sync", "tests"]

[tool.ruff.lint]
# Explicit, not the version-coupled default: a ruff bump must not turn this repo
# red for reasons unrelated to a change.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests spell out their inputs and expectations on purpose.
"tests/*" = ["E501"]
