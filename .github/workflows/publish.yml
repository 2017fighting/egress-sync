name: Publish

# Release signal: a pushed `v*` tag. The workflow runs the tests first — a tag
# that does not pass them must not produce an image the cluster can pull — and
# then publishes ghcr.io/<this repo>:<tag> plus :latest for the tag's commit.
#
# Single-platform (linux/amd64) on purpose: the cluster is amd64-only, and an
# extra architecture would only make the mirror warm-up pull more bytes.
#
# workflow_dispatch exists for a re-publish without re-cutting a tag (same
# convention as 2017fighting/hath-rust).

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish, e.g. v0.1.0"
        required: true
        type: string
      ref:
        description: "Git ref to build (default: the ref this was dispatched from)"
        required: false
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run tests
        run: python -m pytest

  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publishing image tagged: $TAG"

  publish:
    needs: [test, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # provenance is off: it wraps the image in an OCI index, which the
      # registry mirror and digest-pinned HelmRelease do not need.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.tag }}

      # The digest goes into the release/deployment notes; a tag alone does not
      # say which bytes the cluster got.
      - name: Report digest
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${NEEDS_VERSION_OUTPUTS_TAG}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "ghcr.io/${{ github.repository }}:${NEEDS_VERSION_OUTPUTS_TAG}@${digest}"
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${NEEDS_VERSION_OUTPUTS_TAG}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NEEDS_VERSION_OUTPUTS_TAG: ${{ needs.version.outputs.tag }}
